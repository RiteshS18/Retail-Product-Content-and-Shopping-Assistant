version: "3.9"

services:
  api:
    build: .
    container_name: retail_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models_out:/app/models_out
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn retail_assistant.api:app --host 0.0.0.0 --port 8000 --app-dir src

  streamlit:
    build: .
    container_name: retail_ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models_out:/app/models_out
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
